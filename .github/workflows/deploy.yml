name: Deploy to VPS

# Every push to refactor redeploys the bot on the VPS: pull the new code,
# sync dependencies, and restart the service.
on:
  push:
    branches: [refactor]
  workflow_dispatch: {}

# If several pushes land quickly, only the newest deploy needs to run.
concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/DodoTheBot
            git fetch origin refactor
            git reset --hard origin/refactor
            export PATH="$HOME/.local/bin:$PATH"
            uv pip install --python .venv/bin/python -r requirements.txt --quiet
            systemctl restart dodo
            sleep 6
            systemctl is-active dodo
